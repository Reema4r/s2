body.dark{--bg:#0f1117;--card:#171a22;--text:#f5f7fb;--muted:#9da4b3;--line:#2a2e3a;--soft:#20242e;--shadow:none}.dark .day.today{background:#20243b}

<div id="itemModal" class="modal hidden"><form id="itemForm" class="modalbox"><div class="modalhead"><div><h2 id="itemHeading">إضافة جديدة</h2></div><button type="button" class="icon" data-close="itemModal">×</button></div><div class="form"><label class="span2">العنوان<input id="iTitle" required></label><label>القسم<select id="iCategory"></select></label><label>النوع<select id="iType"><option value="task">مهمة</option><option value="appointment">موعد</option><option value="habit">عادة</option><option value="renewal">تجديد</option></select></label><label>التاريخ<input id="iDate" type="date" required></label><label>البداية<input id="iStart" type="time"></label><label>النهاية<input id="iEnd" type="time"></label><label>التكرار<select id="iRepeat"><option value="none">مرة واحدة</option><option value="daily">يومي</option><option value="weekly">أسبوعي</option><option value="monthly">شهري</option><option value="yearly">سنوي</option></select></label><label>المكان<input id="iLocation"></label><label>الشخص / الجهة<input id="iPerson"></label><label class="span2">التفاصيل<textarea id="iNotes" rows="3"></textarea></label></div><fieldset class="reminders"><legend>التذكيرات</legend><label><input type="checkbox" name="irem" value="5">5 د</label><label><input type="checkbox" name="irem" value="15">15 د</label><label><input type="checkbox" name="irem" value="30">30 د</label><label><input type="checkbox" name="irem" value="60">ساعة</label><label><input type="checkbox" name="irem" value="1440">يوم</label></fieldset><div class="modal-actions"><button type="button" class="btn ghost" data-close="itemModal">إلغاء</button><button class="btn primary">حفظ</button></div></form></div>

<script>
(function(){'use strict';
var KEY='task_manager_stable_v5',THEME='task_manager_theme_v5';
var seed={categories:[{id:'health',name:'المواعيد الطبية',icon:'🩺',color:'#ef6c63'},{id:'personal',name:'المهام العامة',icon:'✓',color:'#64748b'},{id:'renewals',name:'التجديدات والفواتير',icon:'↻',color:'#f59e0b'},{id:'habits',name:'العادات',icon:'🌱',color:'#22a06b'}],courses:[{id:'c1',title:'مبادئ المحاسبة والمالية',day:0,start:'17:00',end:'18:20',person:'د. إحسان أحمد باتياه',color:'#3b82f6',notes:'الشعبة M'},{id:'c2',title:'تخطيط التسويق الاستراتيجي',day:1,start:'17:00',end:'18:20',person:'د. لجين عيسى الخميسي',color:'#8b5cf6',notes:'الشعبة M'},{id:'c3',title:'قياس التسويق',day:2,start:'17:00',end:'18:20',person:'د. عهود محمد القرني',color:'#14b8a6',notes:'الشعبة M'},{id:'c4',title:'ريادة الأعمال',day:2,start:'20:00',end:'21:20',person:'د. محمد عبدالله بالبيد',color:'#f59e0b',notes:'الشعبة M'},{id:'c5',title:'القانون التجاري السعودي',day:3,start:'18:30',end:'19:50',person:'د. وائل نزية السيد',color:'#ef6c63',notes:'الشعبة M'}],items:[],academic:[]};
var state=load(),current='home',calCursor=new Date(),selectedDate=new Date(),courseId=null,courseTab='assignment',editId=null;
function clone(x){return JSON.parse(JSON.stringify(x))}function load(){try{var x=JSON.parse(localStorage.getItem(KEY));if(x&&x.courses&&x.items&&x.academic&&x.categories)return x}catch(e){}localStorage.setItem(KEY,JSON.stringify(seed));return clone(seed)}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function pad(n){return String(n).padStart(2,'0')}function dk(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function parseDT(date,time){var p=date.split('-').map(Number),t=(time||'00:00').split(':').map(Number);return new Date(p[0],p[1]-1,p[2],t[0]||0,t[1]||0)}function add(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}function arDate(d,opt){return new Intl.DateTimeFormat('ar-SA-u-ca-gregory',opt||{weekday:'long',day:'numeric',month:'long'}).format(d)}function arTime(t){if(!t)return'بدون وقت';var a=t.split(':').map(Number),h=a[0],m=a[1],pm=h>=12;h=h%12||12;return h+':'+pad(m)+' '+(pm?'م':'ص')}function monthLabel(d){return new Intl.DateTimeFormat('ar-SA-u-ca-gregory',{month:'long',year:'numeric'}).format(d)}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function cat(id){for(var i=0;i<state.categories.length;i++)if(state.categories[i].id===id)return state.categories[i];return{name:'بدون قسم',icon:'•',color:'#94a3b8'}}
function eventCourse(c,d){return{source:'course',id:c.id,title:c.title,subtitle:c.person,color:c.color,start:parseDT(dk(d),c.start),end:parseDT(dk(d),c.end)}}function eventItem(i,d){return{source:'item',id:i.id,title:i.title,subtitle:cat(i.category).name,color:cat(i.category).color,start:parseDT(dk(d),i.start||'00:00'),end:i.end?parseDT(dk(d),i.end):new Date(parseDT(dk(d),i.start||'00:00').getTime()+3600000)}}function eventAcademic(a){var c=state.courses.find(function(x){return x.id===a.courseId});return{source:'academic',id:a.id,title:a.title,subtitle:({assignment:'واجب',exam:'اختبار',forum:'منتدى'})[a.kind],color:c?c.color:'#5267f7',start:parseDT(a.date,a.time||'23:00'),end:new Date(parseDT(a.date,a.time||'23:00').getTime()+1800000)}}
function itemsIn(i,from,to){var out=[],anchor=parseDT(i.date,i.start||'00:00');if(i.repeat==='none'){if(anchor>=from&&anchor<=to)out.push(eventItem(i,anchor));return out}var step=i.repeat==='daily'?1:i.repeat==='weekly'?7:0;if(step){var cur=new Date(anchor),g=0;while(cur<from&&g<700){cur=add(cur,step);g++}while(cur<=to&&g<1400){out.push(eventItem(i,cur));cur=add(cur,step);g++}return out}return out}
function eventsBetween(from,to){var out=[],start=new Date(from.getFullYear(),from.getMonth(),from.getDate());for(var d=new Date(start);d<=to;d=add(d,1)){state.courses.forEach(function(c){if(c.day===d.getDay())out.push(eventCourse(c,d))})}state.items.forEach(function(i){out=out.concat(itemsIn(i,from,to))});state.academic.forEach(function(a){if(a.date&&!a.done){var e=eventAcademic(a);if(e.start>=from&&e.start<=to)out.push(e)}});return out.sort(function(a,b){return a.start-b.start})}
function dayEvents(d){return eventsBetween(new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,0,0),new Date(d.getFullYear(),d.getMonth(),d.getDate(),23,59,59))}function nextEvent(){var n=new Date(),x=eventsBetween(new Date(n.getTime()-60000),add(n,60));for(var i=0;i<x.length;i++)if(x[i].end>=n)return x[i];return null}function due(d){var diff=d-new Date();if(diff<=0)return'الآن';var m=Math.ceil(diff/60000);if(m<60)return'بعد '+m+' دقيقة';var h=Math.floor(m/60);if(h<24)return'بعد '+h+' ساعة';return'بعد '+Math.ceil(h/24)+' يوم'}function toast(s){var t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show')},1800)}
function setActive(){document.querySelectorAll('[data-view]').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-view')===current)})}function setHead(){var m={home:['الرئيسية','المهم فقط، بدون زحمة.'],calendar:['التقويم','كل مواعيدك في نظرة واحدة.'],courses:['المواد','واجبات، اختبارات، ومنتدى داخل كل مادة.'],tasks:['المهام','كل مهامك ومواعيدك.'],sections:['الأقسام','تقسيم واضح وبسيط.'],settings:['الإعدادات','الإشعارات والنسخ الاحتياطي.']};document.getElementById('title').textContent=m[current][0];document.getElementById('subtitle').textContent=m[current][1]}function ehtml(e){return'<button class="event" data-event="'+e.source+':'+e.id+'"><i class="bar" style="--c:'+e.color+'"></i><span><b>'+esc(e.title)+'</b><small>'+esc(e.subtitle||'')+'</small></span><span class="time">'+esc(arTime(pad(e.start.getHours())+':'+pad(e.start.getMinutes())))+'</span></button>'}
function render(){setActive();setHead();({home:home,calendar:calendar,courses:courses,tasks:tasks,sections:sections,settings:settings})[current]()}
function home(){var v=document.getElementById('view'),n=new Date(),today=dayEvents(n),tm=dayEvents(add(n,1)),next=nextEvent();v.innerHTML='<div class="hero">'+(next?'<div class="next"><div><small>القادم</small><h2>'+esc(next.title)+'</h2><p>'+esc(arDate(next.start))+' · '+esc(arTime(pad(next.start.getHours())+':'+pad(next.start.getMinutes())))+(next.subtitle?' · '+esc(next.subtitle):'')+'</p></div><span class="count">'+esc(due(next.start))+'</span></div>':'<div class="next"><div><small>القادم</small><h2>لا يوجد شيء قريب</h2></div></div>')+'<div class="stats"><div class="stat"><span>اليوم</span><strong>'+today.length+'</strong></div><div class="stat"><span>غدًا</span><strong>'+tm.length+'</strong></div><div class="stat"><span>المواد</span><strong>'+state.courses.length+'</strong></div></div></div><div class="quick"><button id="qCal"><b>▦ التقويم الكامل</b><small>الشهر والعلامات</small></button><button id="qCourses"><b>▤ المواد</b><small>واجبات واختبارات ومنتدى</small></button><button id="qAdd"><b>＋ إضافة</b><small>مهمة أو موعد</small></button></div><div class="card"><div class="head"><h2>اليوم</h2><span class="sub">'+esc(arDate(n))+'</span></div><div class="list">'+(today.length?today.slice(0,5).map(ehtml).join(''):'<div class="empty">لا يوجد شيء اليوم.</div>')+'</div></div>';bindEvents();document.getElementById('qCal').onclick=function(){current='calendar';selectedDate=n;calCursor=new Date(n);render()};document.getElementById('qCourses').onclick=function(){current='courses';render()};document.getElementById('qAdd').onclick=function(){openItem()}}
function calendar(){var v=document.getElementById('view'),y=calCursor.getFullYear(),m=calCursor.getMonth(),first=new Date(y,m,1),start=add(first,-first.getDay()),end=add(start,41),all=eventsBetween(start,new Date(end.getFullYear(),end.getMonth(),end.getDate(),23,59,59)),by={};all.forEach(function(e){var k=dk(e.start);(by[k]||(by[k]=[])).push(e)});var h='<div class="calendar"><div class="cal-top"><div><h2>'+esc(monthLabel(calCursor))+'</h2><span class="sub">اضغط اليوم لعرض تفاصيله</span></div><div class="cal-controls"><button id="nextM">‹</button><button id="todayM">اليوم</button><button id="prevM">›</button></div></div><div class="week"><div>الأحد</div><div>الإثنين</div><div>الثلاثاء</div><div>الأربعاء</div><div>الخميس</div><div>الجمعة</div><div>السبت</div></div><div class="grid">';for(var i=0;i<42;i++){var d=add(start,i),k=dk(d),ev=by[k]||[],cl='day'+(d.getMonth()!==m?' out':'')+(k===dk(new Date())?' today':'')+(selectedDate&&k===dk(selectedDate)?' sel':'');h+='<button class="'+cl+'" data-day="'+k+'"><span class="num">'+d.getDate()+'</span><span class="dots">'+ev.slice(0,4).map(function(x){return'<i class="dot" style="--dc:'+x.color+'"></i>'}).join('')+'</span></button>'}h+='</div><div id="drawer"></div></div>';v.innerHTML=h;document.getElementById('prevM').onclick=function(){calCursor=new Date(y,m-1,1);selectedDate=new Date(calCursor);calendar()};document.getElementById('nextM').onclick=function(){calCursor=new Date(y,m+1,1);selectedDate=new Date(calCursor);calendar()};document.getElementById('todayM').onclick=function(){calCursor=new Date();selectedDate=new Date();calendar()};document.querySelectorAll('[data-day]').forEach(function(b){b.onclick=function(){var p=b.getAttribute('data-day').split('-').map(Number);selectedDate=new Date(p[0],p[1]-1,p[2]);calendar()}});drawer()}
function drawer(){var b=document.getElementById('drawer'),a=dayEvents(selectedDate);b.innerHTML='<div class="drawer"><div class="drawer-title"><h3>'+esc(arDate(selectedDate,{weekday:'long',day:'numeric',month:'long'}))+'</h3><button id="addDay" class="btn primary">＋ إضافة</button></div><div class="list">'+(a.length?a.map(ehtml).join(''):'<div class="empty">لا توجد مواعيد في هذا اليوم.</div>')+'</div></div>';bindEvents();document.getElementById('addDay').onclick=function(){openItem(null,{date:dk(selectedDate)})}}
function courses(){var v=document.getElementById('view');if(courseId){courseDetail();return}v.innerHTML='<div class="course-grid">'+state.courses.map(function(c){var n={assignment:0,exam:0,forum:0};state.academic.filter(function(a){return a.courseId===c.id&&!a.done}).forEach(function(a){n[a.kind]++});return'<button class="course" data-course="'+c.id+'" style="--cc:'+c.color+'"><h3>'+esc(c.title)+'</h3><p>'+esc(c.person)+'</p><div class="badges"><span class="badge">'+['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][c.day]+' · '+esc(arTime(c.start))+'</span><span class="badge">واجبات '+n.assignment+'</span><span class="badge">اختبارات '+n.exam+'</span><span class="badge">منتدى '+n.forum+'</span></div></button>'}).join('')+'</div>';document.querySelectorAll('[data-course]').forEach(function(b){b.onclick=function(){courseId=b.getAttribute('data-course');courseTab='assignment';courses()}})}
function courseDetail(){var c=state.courses.find(function(x){return x.id===courseId}),names={assignment:'الواجبات',exam:'الاختبارات',forum:'المنتدى'},arr=state.academic.filter(function(a){return a.courseId===courseId&&a.kind===courseTab}),v=document.getElementById('view');v.innerHTML='<div class="card"><button id="backCourses" class="back">← رجوع للمواد</button><div class="course-title">'+esc(c.title)+'</div><div class="sub">'+esc(c.person)+' · '+['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][c.day]+' · '+esc(arTime(c.start))+' — '+esc(arTime(c.end))+' · '+esc(c.notes)+'</div><div class="tabs" style="margin-top:15px">'+Object.keys(names).map(function(k){return'<button class="'+(k===courseTab?'active':'')+'" data-tab="'+k+'">'+names[k]+' ('+state.academic.filter(function(a){return a.courseId===courseId&&a.kind===k&&!a.done}).length+')</button>'}).join('')+'</div></div><div class="card"><div class="head"><h2>'+names[courseTab]+'</h2><button id="addAcademic" class="btn primary">＋ إضافة</button></div><div class="list">'+(arr.length?arr.map(function(a){return'<div class="academic '+(a.done?'done':'')+'"><div><b>'+esc(a.title)+'</b><small>'+(a.date?esc(arDate(parseDT(a.date,a.time||'12:00'),{day:'numeric',month:'long'})):'بدون تاريخ')+'</small></div><div class="mini-actions"><button data-done="'+a.id+'">'+(a.done?'↺':'✓')+'</button><button data-del="'+a.id+'">×</button></div></div>'}).join(''):'<div class="empty">لا يوجد شيء هنا حتى الآن.</div>')+'</div></div>';document.getElementById('backCourses').onclick=function(){courseId=null;courses()};document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){courseTab=b.getAttribute('data-tab');courseDetail()}});document.getElementById('addAcademic').onclick=function(){openAcademic(courseId,courseTab)};document.querySelectorAll('[data-done]').forEach(function(b){b.onclick=function(){var a=state.academic.find(function(x){return x.id===b.getAttribute('data-done')});a.done=!a.done;save();courseDetail()}});document.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){state.academic=state.academic.filter(function(x){return x.id!==b.getAttribute('data-del')});save();courseDetail()}})}
function tasks(){var v=document.getElementById('view');v.innerHTML='<div class="toolbar"><input id="search" placeholder="ابحث عن مهمة أو موعد..."><select id="filter"><option value="">كل الأقسام</option>'+state.categories.map(function(c){return'<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('')+'</select></div><div id="taskList" class="list"></div>';function draw(){var q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value,n=new Date(),arr=state.items.filter(function(i){return(!q||(i.title+' '+i.person+' '+i.notes).toLowerCase().includes(q))&&(!f||i.category===f)}).map(function(i){var x=itemsIn(i,add(n,-1),add(n,400));return x[0]||eventItem(i,parseDT(i.date,i.start||'00:00'))});document.getElementById('taskList').innerHTML=arr.length?arr.map(ehtml).join(''):'<div class="empty">لا توجد نتائج.</div>';bindEvents()}document.getElementById('search').oninput=draw;document.getElementById('filter').onchange=draw;draw()}
function sections(){document.getElementById('view').innerHTML='<div class="categories">'+state.categories.map(function(c){return'<div class="cat" style="--cc:'+c.color+'"><span>'+esc(c.icon)+'</span><strong>'+esc(c.name)+'</strong><small>'+state.items.filter(function(i){return i.category===c.id&&!i.done}).length+' عناصر نشطة</small></div>'}).join('')+'</div>'}
function settings(){document.getElementById('view').innerHTML='<div class="settings"><div class="setting"><h3>تثبيت على الآيفون</h3><p>Safari ← مشاركة ← إضافة إلى الشاشة الرئيسية.</p></div><div class="setting"><h3>البيانات</h3><p>البيانات تحفظ محليًا على جهازك.</p></div></div>'}
function bindEvents(){document.querySelectorAll('[data-event]').forEach(function(b){b.onclick=function(){var p=b.getAttribute('data-event').split(':'),s=p[0],id=p[1];if(s==='course'){current='courses';courseId=id;render()}else if(s==='academic'){var a=state.academic.find(function(x){return x.id===id});if(a){current='courses';courseId=a.courseId;courseTab=a.kind;render()}}else openDetail(id)}})}
function fillCats(){document.getElementById('iCategory').innerHTML=state.categories.map(function(c){return'<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('')}function showModal(id){document.getElementById(id).classList.remove('hidden');document.body.style.overflow='hidden'}function hideModal(id){document.getElementById(id).classList.add('hidden');document.body.style.overflow=''}
function openItem(id,p){editId=id||null;document.getElementById('itemForm').reset();fillCats();document.getElementById('iDate').value=p&&p.date?p.date:dk(new Date());if(editId){var i=state.items.find(function(x){return x.id===editId});document.getElementById('iTitle').value=i.title;document.getElementById('iCategory').value=i.category;document.getElementById('iType').value=i.type;document.getElementById('iDate').value=i.date;document.getElementById('iStart').value=i.start||'';document.getElementById('iEnd').value=i.end||'';document.getElementById('iRepeat').value=i.repeat||'none';document.getElementById('iLocation').value=i.location||'';document.getElementById('iPerson').value=i.person||'';document.getElementById('iNotes').value=i.notes||''}showModal('itemModal')}
function openAcademic(cid,kind){var c=state.courses.find(function(x){return x.id===cid});document.getElementById('academicForm').reset();document.getElementById('aCourse').value=cid;document.getElementById('aKind').value=kind;document.getElementById('aHeading').textContent='إضافة '+({assignment:'واجب',exam:'اختبار',forum:'موضوع منتدى'})[kind];document.getElementById('aCourseName').textContent=c.title;showModal('academicModal')}
function openDetail(id){var i=state.items.find(function(x){return x.id===id});document.getElementById('detailBox').innerHTML='<div class="modalhead"><div><h2>'+esc(i.title)+'</h2><p>'+esc(i.date)+(i.start?' · '+esc(arTime(i.start)):'')+'</p></div><button class="icon" data-close="detailModal">×</button></div><div class="modal-actions"><button id="editItem" class="btn ghost">تعديل</button><button id="deleteItem" class="btn ghost">حذف</button></div>';showModal('detailModal');document.querySelector('#detailBox [data-close]').onclick=function(){hideModal('detailModal')};document.getElementById('editItem').onclick=function(){hideModal('detailModal');openItem(id)};document.getElementById('deleteItem').onclick=function(){state.items=state.items.filter(function(x){return x.id!==id});save();hideModal('detailModal');render()}}
document.getElementById('itemForm').onsubmit=function(e){e.preventDefault();var obj={id:editId||('i_'+Date.now().toString(36)),title:document.getElementById('iTitle').value.trim(),category:document.getElementById('iCategory').value,type:document.getElementById('iType').value,date:document.getElementById('iDate').value,start:document.getElementById('iStart').value,end:document.getElementById('iEnd').value,repeat:document.getElementById('iRepeat').value,location:document.getElementById('iLocation').value.trim(),person:document.getElementById('iPerson').value.trim(),notes:document.getElementById('iNotes').value.trim(),done:false};if(editId){var k=state.items.findIndex(function(x){return x.id===editId});state.items[k]=obj}else state.items.push(obj);save();hideModal('itemModal');render();toast('تم الحفظ')};
document.getElementById('academicForm').onsubmit=function(e){e.preventDefault();var cid=document.getElementById('aCourse').value,kind=document.getElementById('aKind').value;state.academic.push({id:'a_'+Date.now().toString(36),courseId:cid,kind:kind,title:document.getElementById('aTitle').value.trim(),date:document.getElementById('aDate').value,time:document.getElementById('aTime').value,notes:document.getElementById('aNotes').value.trim(),done:false});save();hideModal('academicModal');courseId=cid;courseTab=kind;current='courses';render();toast('تمت الإضافة')};
document.querySelectorAll('[data-close]').forEach(function(b){b.onclick=function(){hideModal(b.getAttribute('data-close'))}});document.querySelectorAll('[data-view]').forEach(function(b){b.onclick=function(){current=b.getAttribute('data-view');if(current!=='courses')courseId=null;render()}});document.getElementById('sideAdd').onclick=function(){openItem()};document.getElementById('topAdd').onclick=function(){openItem()};document.getElementById('mobileAdd').onclick=function(){openItem()};document.getElementById('theme').onclick=function(){document.body.classList.toggle('dark');localStorage.setItem(THEME,document.body.classList.contains('dark')?'dark':'light')};if(localStorage.getItem(THEME)==='dark')document.body.classList.add('dark');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(function(){});render();
})();
</script>
